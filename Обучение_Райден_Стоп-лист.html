<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обучение — Райден.Кухня: Стоп-лист</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --text:#172033; --muted:#687386;
  --accent:#1769e0; --accent2:#0f57bd; --line:#dfe5ee; --good:#198754;
  --warn:#d97706; --shadow:0 14px 35px rgba(28,44,73,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:auto;padding:10px 20px;display:flex;gap:14px;align-items:center}
.progress-wrap{flex:1}
.progress-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
.progress{height:7px;background:#e8edf4;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:.3s}
.lang-btn{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
.hero{max-width:1080px;margin:34px auto 0;padding:0 20px}
.hero-card{background:linear-gradient(135deg,#0f57bd,#1769e0);color:white;border-radius:24px;padding:34px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;opacity:.84}
h1{font-size:clamp(30px,5vw,52px);line-height:1.04;margin:10px 0 12px}
.hero p{max-width:760px;font-size:18px;opacity:.92}
.primary{border:0;background:white;color:var(--accent2);padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.nav{max-width:1080px;margin:18px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nav a{text-decoration:none;color:var(--text);background:white;border:1px solid var(--line);padding:12px;border-radius:12px;text-align:center;font-weight:700}
main{max-width:1080px;margin:18px auto 60px;padding:0 20px}
.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 4px 18px rgba(28,44,73,.04)}
.section h2{font-size:28px;margin:0 0 18px}
.change-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.info{border:1px solid var(--line);border-radius:16px;padding:18px}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.05em;background:#e7f0ff;color:var(--accent2)}
.badge.neutral{background:#eef1f5;color:#5f6878}
.info h3{margin:10px 0 6px;font-size:20px}
.info p,.screen-copy p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.step{display:flex;gap:13px;border:1px solid var(--line);border-radius:16px;padding:16px}
.num{width:34px;height:34px;border-radius:10px;background:#e7f0ff;color:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.step h3{margin:0 0 4px;font-size:18px}
.step p{margin:0;color:var(--muted)}
.screen{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);gap:18px;align-items:start;margin-top:18px}
.screen img{width:100%;border:1px solid var(--line);border-radius:14px;display:block;background:white}
.screen-copy{border-left:4px solid var(--accent);padding:8px 0 8px 16px}
.screen-copy h3{margin:0 0 7px}
.quiz{display:grid;gap:16px}
.question{border:1px solid var(--line);border-radius:16px;padding:16px}
.question h3{margin:0 0 12px;font-size:18px}
.options{display:grid;gap:8px}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.option:hover{background:#f8faff}
.option input{margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.check-btn,.retry-btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.check-btn{background:var(--accent);color:white}
.retry-btn{background:#edf2f8;color:var(--text)}
.result{display:none;margin-top:14px;padding:14px;border-radius:14px;font-weight:700}
.result.ok{display:block;background:#e9f7ef;color:#146c43}
.result.bad{display:block;background:#fff4e5;color:#9a5b00}
.done{margin-top:18px;background:#eef5ff;border:1px solid #cfe0ff;border-radius:16px;padding:18px;display:none}
.done.show{display:block}
.done h3{margin:0 0 6px}
.done p{margin:0;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
@media(max-width:760px){
  .change-grid,.steps,.screen{grid-template-columns:1fr}
  .hero-card{padding:24px}
  .nav{grid-template-columns:1fr}
  .section{padding:18px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="progress-wrap">
      <div class="progress-label"><span data-i18n="progress"></span><span id="pct">0%</span></div>
      <div class="progress"><div id="bar"></div></div>

    <button class="lang-btn" id="langBtn" aria-label="Switch language"></button>
  </div>
</div>

<header class="hero">
  <div class="hero-card">

    <button class="primary" id="startBtn" data-i18n="start"></button>

</header>

<nav class="nav">

        <p data-i18n="unchanged_text"></p>

    </div>

let lang = 'ru';
let viewed = new Set();
let quizCompleted = false;

function t(k) { return I18N[lang][k] ?? k; }

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('langBtn').textContent = t('lang');
  renderQuiz();
  if (quizCompleted) showScore(true);
}

function renderQuiz() {
  const box = document.getElementById('quizBox');
  const saved = [0,1,2].map(i => document.querySelector(`input[name="q${i+1}"]:checked`)?.value ?? null);
  box.innerHTML = '';
  for (let i=1;i<=3;i++) {
    const q = document.createElement('div');
    q.className = 'question';
    const h = document.createElement('h3');
    h.textContent = `${i}. ${t('q'+i)}`;
    q.appendChild(h);
    const opts = document.createElement('div');
    opts.className = 'options';
    t('q'+i+'a').forEach((label, idx) => {
      const lab = document.createElement('label');
      lab.className='option';
      lab.innerHTML = `<input type="radio" name="q${i}" value="${idx}"><span></span>`;
      lab.querySelector('span').textContent = label;
      opts.appendChild(lab);
    });
    q.appendChild(opts);
    box.appendChild(q);
  }
  saved.forEach((v,i)=>{ if(v!==null) { const el=document.querySelector(`input[name="q${i+1}"][value="${v}"]`); if(el) el.checked=true; } });
}

function scoreQuiz() {
  let score = 0;
  for (let i=1;i<=3;i++) {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (selected && Number(selected.value) === t('q'+i+'correct')) score++;
  }
  return score;
}

function showScore(preserve=false) {
  const score = scoreQuiz();
  const result = document.getElementById('result');
  result.className = 'result ' + (score===3 ? 'ok' : 'bad');
  result.textContent = `${t('result_score')}: ${score}/3. ` + (score===3 ? t('result_ok') : t('result_mid'));
  if (score===3) {
    quizCompleted = true;
    document.getElementById('done').classList.add('show');
    viewed.add('quiz');
  } else if (!preserve) {
    document.getElementById('done').classList.remove('show');
  }
  updateProgress();
}

function resetQuiz() {
  document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);
  document.getElementById('result').className='result';
  document.getElementById('result').textContent='';
  document.getElementById('done').classList.remove('show');
  quizCompleted=false;
  viewed.delete('quiz');
  updateProgress();
}

function updateProgress() {
  const base = viewed.size;
  const pct = Math.min(100, Math.round((base/3)*100));
  document.getElementById('bar').style.width = pct+'%';
  document.getElementById('pct').textContent = pct+'%';
}

document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  renderStatic();
});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('changes').scrollIntoView({behavior:'smooth'});
});

document.getElementById('checkBtn').addEventListener('click', () => showScore(false));
document.getElementById('retryBtn').addEventListener('click', resetQuiz);

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if(e.isIntersecting && e.intersectionRatio > .35) {
      const id = e.target.id;
      if(id==='changes' || id==='how') viewed.add(id);
      updateProgress();
    }
  });
}, {threshold:[.35]});

document.querySelectorAll('.track').forEach(s=>observer.observe(s));
renderStatic();
updateProgress();
</script>
</body>
</html>
